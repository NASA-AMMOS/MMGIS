# MMGIS capability catalog
#
# Single source of truth for "what MMGIS does" and how each capability is tested.
# Used by tests/reporting/capability-report.js to build the capability coverage
# report published by .github/workflows/playwright-tests.yml.
#
# Test levels
#   unit  - low-level, no server; must always pass (tests/unit, tests/ci)
#   api   - backend/HTTP behaviour against a running server (no browser UI)
#   flow  - user-facing functional flows driven through the browser
#
# How a test is attributed to a capability (first match wins):
#   1. Playwright tags on the test or its describe block, e.g.
#        test("applies a filter", { tag: ["@UIF-LAYERS-FILTER-01", "@flow"] }, ...)
#      A scenario tag (CAP-NN) also credits its parent capability.
#   2. Otherwise the test file is matched against each capability's `tests` globs.
#   Level comes from an @unit/@api/@flow tag, else the `levels.*.tests` globs below.
#
# Scenarios marked `source: gherkin/...` were seeded from the scenario titles in
# the feature/bdd-gherkin-tests branch. A scenario is only reported as covered
# once a real test carries its tag.

version: 1

levels:
  unit:
    title: Unit / low-level
    description: Pure functions, modules and static checks. Fast, no server, must always pass.
    tests:
      - tests/unit/**
      - tests/ci/**
  api:
    title: API / backend
    description: HTTP routes, backend plugins, security and startup behaviour against a live test server.
    tests:
      - tests/e2e/api/**
      - tests/e2e/security/**
      - tests/e2e/startup/**
      - tests/e2e/middleware.spec.js
      - tests/e2e/performance/api-response-times.spec.js
      - plugins/**/backend/**/tests/**
  flow:
    title: Functional flow
    description: End-to-end user flows in the browser, including corner cases.
    tests:
      - "**"

areas:
  - id: MAP
    title: Map & globe
    description: Mission loading, 2D map and 3D globe rendering, navigation, coordinates, deep links.
  - id: LYR
    title: Layers & data
    description: Layer types, visibility, styling, legends, attachments and time-enabled data.
  - id: UIF
    title: User interaction features
    description: Tools, filters, search, interactions, context menus and panels.
  - id: CFG
    title: Configuration (Configure / CMS)
    description: Mission, layer, tool and interaction configuration in the Configure app.
  - id: AUTH
    title: Authentication & access
    description: Login, sessions, accounts, permissions and long-term tokens.
  - id: API
    title: APIs & integrations
    description: mmgisAPI, geodatasets, STAC, TiTiler, webhooks and other adjacent services.
  - id: COL
    title: Collaboration
    description: Websockets, broadcast and multi-user behaviour.
  - id: PLT
    title: Platform
    description: Security hardening, startup, plugin system, performance, accessibility and compatibility.

capabilities:
  # ---------------------------------------------------------------- MAP
  - id: MAP-INIT
    area: MAP
    title: Load a mission and initialise the map
    risk: high
    requires: [flow]
    paths: [src/essence/essence.js, src/essence/Basics/Map_/**, src/essence/LandingPage/**, src/essence/mmgisAPI/**]
    tests:
      - tests/e2e/smoke.spec.js
      - tests/e2e/map/map-init.spec.js
      - tests/e2e/map/landing-page.spec.js
      - tests/e2e/map/panel-layout.spec.js
      - tests/e2e/map/error-handling.spec.js
      - tests/e2e/reference-mission*.spec.js
    scenarios:
      - { id: MAP-INIT-01, title: Loading a mission with default view, source: gherkin/MapNavigation.feature }
      - { id: MAP-INIT-02, title: Unknown or misconfigured mission shows a clear error }

  - id: MAP-NAV
    area: MAP
    title: Navigate the map, coordinates and deep links
    risk: high
    requires: [unit, flow]
    paths: [src/essence/Basics/Formulae_/**, src/essence/services/QueryURL.js, src/essence/Basics/UserInterface_/BottomBar.js]
    tests:
      - tests/unit/formulae.spec.js
      - tests/e2e/map/coordinates.spec.js
      - tests/e2e/map/deep-linking.spec.js
      - tests/e2e/map/bottom-bar.spec.js
      - tests/e2e/map/hotkeys.spec.js
    scenarios:
      - { id: MAP-NAV-01, title: Panning and zooming the map, source: gherkin/MapNavigation.feature }
      - { id: MAP-NAV-02, title: Deep linking to specific map coordinates, source: gherkin/MapNavigation.feature }
      - { id: MAP-NAV-03, title: Custom projection coordinate display, source: gherkin/MapNavigation.feature }

  - id: MAP-GLOBE
    area: MAP
    title: 3D globe rendering and 2D/3D switching
    risk: medium
    requires: [unit, flow]
    paths: [src/essence/Basics/Globe_/**]
    tests:
      - tests/unit/globe*.spec.js
      - tests/unit/cesiumVectorReloadIds.spec.js
    scenarios:
      - { id: MAP-GLOBE-01, title: Switching between 2D and 3D views, source: gherkin/MapNavigation.feature }
      - { id: MAP-GLOBE-02, title: Vector selection identity is preserved between 2D and 3D }

