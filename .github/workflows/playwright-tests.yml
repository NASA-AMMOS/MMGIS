name: Playwright Tests

on:
  push:
    branches: [master, main, development]
  pull_request:
    branches: [master, main, development]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        auth_mode: [off, local]

    services:
      postgres:
        image: postgis/postgis:13-3.1
        env:
          POSTGRES_DB: mmgis-test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Setup test environment
        run: |
          cp sample.env .env || touch .env
          echo "NODE_ENV=test" >> .env
          echo "PORT=8888" >> .env
          echo "AUTH=${{ matrix.auth_mode }}" >> .env
          echo "DB_HOST=localhost" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_NAME=mmgis-test" >> .env
          echo "DB_USER=test_user" >> .env
          echo "DB_PASS=test_password" >> .env
          echo "ENABLE_MMGIS_WEBSOCKETS=false" >> .env
          echo "ENABLE_CONFIG_WEBSOCKETS=false" >> .env
          echo "HIDE_CONFIG=false" >> .env

      - name: Initialize Database
        run: node scripts/init-db.js

      - name: Setup Reference Mission
        env:
          TEST_ADMIN_USER: test_admin
          TEST_ADMIN_PASS: TestAdmin1!
          TEST_USER_USER: test_user
          TEST_USER_PASS: TestUser1!
          TEST_USER_EMAIL: test_user@test.com
        run: |
          node scripts/server.js &
          sleep 10

          if [ "${{ matrix.auth_mode }}" = "local" ]; then
            # Seed an admin user via first_signup (first user gets admin permission "111")
            curl -s -X POST http://localhost:8888/api/users/first_signup \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"${TEST_ADMIN_USER}\",\"password\":\"${TEST_ADMIN_PASS}\"}" || true

            # Login as the admin to get a session cookie
            COOKIE_JAR=$(mktemp)
            curl -s -c "$COOKIE_JAR" -X POST http://localhost:8888/api/users/login \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"${TEST_ADMIN_USER}\",\"password\":\"${TEST_ADMIN_PASS}\"}" || true

            # Create a regular (non-admin) test_user account via signup (requires admin session)
            curl -s -b "$COOKIE_JAR" -X POST http://localhost:8888/api/users/signup \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"${TEST_USER_USER}\",\"password\":\"${TEST_USER_PASS}\",\"email\":\"${TEST_USER_EMAIL}\",\"skipLogin\":true}" || true

            # Use authenticated session to create Reference Mission
            curl -s -b "$COOKIE_JAR" -X POST http://localhost:8888/api/configure/add \
              -H "Content-Type: application/json" \
              -d '{"setupReferenceMission": true}' || true

            rm -f "$COOKIE_JAR"
          else
            # AUTH=off — no authentication needed
            curl -s -X POST http://localhost:8888/api/configure/add \
              -H "Content-Type: application/json" \
              -d '{"setupReferenceMission": true}' || true
          fi

          kill %1 || true

      - name: Run Unit Tests
        run: npx playwright test tests/unit --project=chromium
        env:
          AUTH: ${{ matrix.auth_mode }}

      - name: Run E2E API Tests
        run: npx playwright test tests/e2e/api tests/e2e/security tests/e2e/startup --project=chromium
        env:
          AUTH: ${{ matrix.auth_mode }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.auth_mode }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.auth_mode }}
          path: test-results/
          retention-days: 7
