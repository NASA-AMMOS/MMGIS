name: Playwright Tests

on:
  push:
    branches: [master, main, development]
  pull_request:
    branches: [master, main, development]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        auth_mode: [off, local]
        include:
          - auth_mode: off
            site_access: public
          - auth_mode: local
            site_access: required

    services:
      postgres:
        image: postgis/postgis:13-3.1
        env:
          POSTGRES_DB: mmgis-test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Python for adjacent servers
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install adjacent server Python packages
        run: pip install "titiler.application" "python-dotenv[cli]" uvicorn

      - name: Setup test environment
        run: | # pragma: allowlist secret
          cp sample.env .env || touch .env
          sed -i "/^SITE_ACCESS=/d;/^AUTH_PROVIDERS=/d" .env
          echo "NODE_ENV=test" >> .env
          echo "PORT=18888" >> .env
          echo "SITE_ACCESS=${{ matrix.site_access }}" >> .env
          echo 'AUTH_PROVIDERS=["local"]' >> .env
          echo "DB_HOST=localhost" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_NAME=mmgis-test" >> .env
          echo "DB_USER=test_user" >> .env
          echo "DB_PASS=test_password" >> .env
          echo "DB_USER_TEST=test_user" >> .env
          echo "DB_PASS_TEST=test_password" >> .env
          echo "ENABLE_MMGIS_WEBSOCKETS=false" >> .env
          echo "ENABLE_CONFIG_WEBSOCKETS=false" >> .env
          echo "HIDE_CONFIG=false" >> .env
          echo "SECRET=ci-test-session-secret-not-for-production" >> .env

      # DB creation, Reference Mission setup, and server lifecycle are all
      # handled by tests/global-setup.js (runs before any test suite).
      # No manual init-db / server start / curl steps needed.

      - name: Run Unit Tests
        run: npx playwright test tests/unit --project=chromium
        env:
          SITE_ACCESS: ${{ matrix.site_access }}
          AUTH_PROVIDERS: local
          PLAYWRIGHT_TEST_UNIT_ONLY: "true"

      # Every plugin's tests tagged @unit, wherever the plugin lives
      - name: Run Plugin Unit Tests
        run: npx playwright test plugins --grep @unit --project=chromium
        env:
          SITE_ACCESS: ${{ matrix.site_access }}
          AUTH_PROVIDERS: local
          PLAYWRIGHT_TEST_UNIT_ONLY: "true"

      - name: Run E2E API Tests
        run: npx playwright test tests/e2e/api tests/e2e/security tests/e2e/startup --project=chromium
        env:
          SITE_ACCESS: ${{ matrix.site_access }}
          AUTH_PROVIDERS: local

      # Plugin suites call routes without signing in, so they run on the public site
      - name: Run Backend Plugin Tests
        if: matrix.site_access == 'public'
        run: npx --no-install playwright test plugins/core/backend --project=chromium
        env:
          SITE_ACCESS: ${{ matrix.site_access }}
          AUTH_PROVIDERS: local

      - name: Run E2E Auth Tests
        run: npx --no-install playwright test tests/e2e/auth --project=chromium
        env:
          SITE_ACCESS: ${{ matrix.site_access }}
          AUTH_PROVIDERS: local

      - name: Check existing accounts survive the upgrade
        if: matrix.site_access == 'required' && github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=200 origin ${{ github.base_ref }}
          # Seed with the last release before the auth refactor (the commit before scripts/auth-migrate.js was added)
          added=$(git log --diff-filter=A --format=%H -1 origin/${{ github.base_ref }} -- scripts/auth-migrate.js)
          if [ -n "$added" ]; then legacy="$added^"; else legacy=origin/${{ github.base_ref }}; fi
          bash tests/migration/run-legacy-compat.sh "$legacy"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.auth_mode }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.auth_mode }}
          path: test-results/
          retention-days: 7

  # The proxy login provider (the replacement for AUTH=csso), with the headers a
  # reverse proxy would add, under legacy network trust and the default secret trust.
  proxy:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      matrix:
        proxy_trust: [network, secret]

    services:
      postgres:
        image: postgis/postgis:13-3.1
        env:
          POSTGRES_DB: mmgis-test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install plugin dependencies
        run: node scripts/resolve-plugin-deps.js && node scripts/install-plugin-deps.js

      - name: Install Playwright Browsers
        run: npx --no-install playwright install --with-deps chromium

      - name: Setup test environment
        run: | # pragma: allowlist secret
          cp sample.env .env || touch .env
          sed -i "/^SITE_ACCESS=/d;/^AUTH_PROVIDERS=/d;/^PROXY_/d" .env
          echo "NODE_ENV=test" >> .env
          echo "PORT=18888" >> .env
          echo "DB_HOST=localhost" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_NAME=mmgis-test" >> .env
          echo "DB_USER=test_user" >> .env
          echo "DB_PASS=test_password" >> .env
          echo "DB_USER_TEST=test_user" >> .env
          echo "DB_PASS_TEST=test_password" >> .env
          echo "ENABLE_MMGIS_WEBSOCKETS=false" >> .env
          echo "ENABLE_CONFIG_WEBSOCKETS=false" >> .env
          echo "HIDE_CONFIG=false" >> .env
          echo "SECRET=ci-test-session-secret-not-for-production" >> .env

      - name: Run E2E Proxy Provider Tests
        run: npx --no-install playwright test plugins/core/auth/Proxy/tests --project=chromium
        env:
          SITE_ACCESS: required
          AUTH_PROVIDERS: '["proxy","local"]'
          PROXY_TRUST: ${{ matrix.proxy_trust }}
          PROXY_SECRET: ${{ matrix.proxy_trust == 'secret' && 'ci-test-proxy-secret-not-for-production' || '' }} # pragma: allowlist secret
          PROXY_GROUPS: '["mmgis-users"]'
          PROXY_LEAD_GROUP: mmgis-leads

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-proxy-${{ matrix.proxy_trust }}
          path: playwright-report/
          retention-days: 30

  ldap:
    # The LDAP login provider against a real OpenLDAP directory, over LDAPS and StartTLS
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      matrix:
        transport: [ldaps, starttls]

    services:
      postgres:
        image: postgis/postgis:13-3.1
        env:
          POSTGRES_DB: mmgis-test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install plugin dependencies
        run: node scripts/resolve-plugin-deps.js && node scripts/install-plugin-deps.js

      - name: Install Playwright Browsers
        run: npx --no-install playwright install --with-deps chromium

      - name: Start OpenLDAP
        run: plugins/core/auth/Ldap/tests/openldap/start.sh "$RUNNER_TEMP/ldap"

      - name: Setup test environment
        run: | # pragma: allowlist secret
          cp sample.env .env || touch .env
          sed -i "/^SITE_ACCESS=/d;/^AUTH_PROVIDERS=/d;/^LDAP_/d" .env
          echo "NODE_ENV=test" >> .env
          echo "PORT=18888" >> .env
          echo "DB_HOST=localhost" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_NAME=mmgis-test" >> .env
          echo "DB_USER=test_user" >> .env
          echo "DB_PASS=test_password" >> .env
          echo "DB_USER_TEST=test_user" >> .env
          echo "DB_PASS_TEST=test_password" >> .env
          echo "ENABLE_MMGIS_WEBSOCKETS=false" >> .env
          echo "ENABLE_CONFIG_WEBSOCKETS=false" >> .env
          echo "HIDE_CONFIG=false" >> .env
          echo "SECRET=ci-test-session-secret-not-for-production" >> .env

      - name: Run E2E LDAP Provider Tests
        run: npx --no-install playwright test plugins/core/auth/Ldap/tests --grep-invert @unit --project=chromium
        env:
          SITE_ACCESS: optional
          AUTH_PROVIDERS: '["ldap","local"]'
          LDAP_URL: ${{ matrix.transport == 'ldaps' && 'ldaps://localhost:3636' || 'ldap://localhost:3389' }}
          LDAP_STARTTLS: ${{ matrix.transport == 'starttls' && 'true' || 'false' }}
          LDAP_TLS_CA: ${{ runner.temp }}/ldap/ca.pem
          LDAP_BIND_DN: cn=mmgis-svc,ou=services,dc=example,dc=org
          LDAP_BIND_PASSWORD: svc-test-password # pragma: allowlist secret
          LDAP_USER_SEARCH_BASE: ou=people,dc=example,dc=org
          LDAP_GROUP_SEARCH_BASE: ou=groups,dc=example,dc=org
          AUTH_RECHECK_MINUTES: 0.05

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-ldap-${{ matrix.transport }}
          path: playwright-report/
          retention-days: 30
