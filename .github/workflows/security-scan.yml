name: Security-Scan
on:
  workflow_dispatch:
  push:
    branches:
      - development
      - sonarcloud_action
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Extract version from package.json
        id: package_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          queries: security-and-quality, security-extended
      - name: CodeQL Scan
        uses: github/codeql-action/analyze@v3
      - name: Post-Process CodeQL
        run: |
          python3 -m pip install nasa-scrub

          results_dir=`realpath ${{ github.workspace }}/../results`
          sarif_files=`find $results_dir -name '*.sarif'`

          echo "Processing SARIF files from: $results_dir"
          echo "Found SARIF files:"
          echo "$sarif_files"

          for sarif_file in $sarif_files
          do
            output_file="$results_dir/$(basename $sarif_file .sarif)_stripped.sarif"
            echo "Processing: $sarif_file -> $output_file"

            # Run translate_results and check if it succeeds
            if python3 -m scrub.tools.parsers.translate_results "$sarif_file" "$output_file" "${{ github.workspace }}" sarifv2.1.0; then
              # Verify the output file exists and is valid JSON
              if [ -f "$output_file" ]; then
                if python3 -c "import json; json.load(open('$output_file'))"; then
                  echo "Successfully processed and validated: $output_file"
                else
                  echo "ERROR: Invalid JSON in $output_file, using original file"
                  cp "$sarif_file" "$output_file"
                fi
              else
                echo "ERROR: Output file not created: $output_file, using original file"
                cp "$sarif_file" "$output_file"
              fi
            else
              echo "ERROR: translate_results failed for $sarif_file, using original file"
              cp "$sarif_file" "$output_file"
            fi
          done

          echo "RESULTS_DIR=$results_dir" >> $GITHUB_ENV
          echo "Results generated: "
          echo $results_dir

          # Create comma-separated list of SARIF files for SonarQube
          sarif_list=$(find $results_dir -name '*_stripped.sarif' | tr '\n' ',' | sed 's/,$//')
          echo "SARIF_FILES=$sarif_list" >> $GITHUB_ENV

          # List and validate all stripped files
          echo "Final SARIF files:"
          for file in $results_dir/*_stripped.sarif; do
            if [ -f "$file" ]; then
              echo "  - $file ($(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null) bytes)"
            fi
          done
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.sarifReportPaths=${{ env.SARIF_FILES }}
            -Dsonar.projectVersion=${{ env.VERSION }}
