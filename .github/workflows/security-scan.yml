name: Security-Scan
on:
  workflow_dispatch:
  push:
    branches:
      - development
      - sonarcloud_action
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Extract version from package.json
        id: package_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          queries: security-and-quality, security-extended
      - name: CodeQL Scan
        uses: github/codeql-action/analyze@v3
      - name: Prepare SARIF Files
        run: |
          results_dir=`realpath ${{ github.workspace }}/../results`

          echo "SARIF files directory: $results_dir"
          echo "Available SARIF files:"
          ls -lh $results_dir/*.sarif

          # Use original CodeQL SARIF files directly for SonarQube
          # Note: nasa-scrub processing causes SonarQube SARIF parser errors
          # If path stripping is needed for artifact uploads, add it as a separate step
          sarif_list=$(find $results_dir -name '*.sarif' -not -name '*_stripped.sarif' | tr '\n' ',' | sed 's/,$//')

          echo "RESULTS_DIR=$results_dir" >> $GITHUB_ENV
          echo "SARIF_FILES=$sarif_list" >> $GITHUB_ENV

          echo ""
          echo "SARIF files for SonarQube:"
          echo "$sarif_list"
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.sarifReportPaths=${{ env.SARIF_FILES }}
            -Dsonar.projectVersion=${{ env.VERSION }}
